<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe Neon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
      body {
        font-family: 'Poppins', sans-serif;
        transition: background 0.5s ease, color 0.5s ease;
      }
      .cell {
        transition: all 0.3s ease;
      }
      .cell.X {
        color: #00f0ff;
        text-shadow: 0 0 15px #00f0ff, 0 0 30px #00f0ff;
      }
      .cell.O {
        color: #ff007f;
        text-shadow: 0 0 15px #ff007f, 0 0 30px #ff007f;
      }
      body.dark {
        background: #1a1a2e;
        color: #ccc;
      }
      body.dark .game-container {
        background: #0f0f1a;
        border-color: #333;
      }
      body.dark .cell {
        background: #222;
        color: #999;
        text-shadow: none;
      }
      body.dark .cell.X {
        color: #00c0cc;
        text-shadow: none;
      }
      body.dark .cell.O {
        color: #cc0055;
        text-shadow: none;
      }
      body.dark #status {
        color: #ddd;
      }
      body.dark #toggleDark {
        background: #333;
        color: #ddd;
      }
    </style>
  </head>
  <body class="bg-gradient-to-br from-purple-800 via-pink-600 to-blue-500 min-h-screen flex items-center justify-center p-4">
    <div class="absolute top-4 right-4">
      <button
        id="toggleDark"
        class="bg-white text-gray-800 font-bold py-2 px-4 rounded-full shadow-lg transition duration-300 hover:bg-gray-200"
      >
        🌙 Dark Mode
      </button>
    </div>

    <div
      class="game-container bg-gradient-to-b from-purple-700 to-blue-700 rounded-3xl shadow-2xl p-8 max-w-md w-full border-4 border-purple-400 transition duration-500"
    >
      <h1
        class="text-5xl font-extrabold text-center text-white mb-6 drop-shadow-[0_0_15px_rgba(255,255,255,0.8)]"
      >
        Tic Tac Toe
      </h1>
      <div
        id="status"
        class="text-center text-2xl font-bold text-white mb-4 drop-shadow-[0_0_10px_rgba(255,255,255,0.5)]"
      >
        Player <span class="text-cyan-400">X</span>'s turn
      </div>
      <div id="board" class="grid grid-cols-3 gap-4 mb-6">
        <div
          class="cell bg-gradient-to-br from-purple-900 to-purple-700 rounded-xl shadow-lg w-24 h-24 flex items-center justify-center text-5xl font-bold cursor-pointer hover:scale-110"
        ></div>
        <div
          class="cell bg-gradient-to-br from-purple-900 to-purple-700 rounded-xl shadow-lg w-24 h-24 flex items-center justify-center text-5xl font-bold cursor-pointer hover:scale-110"
        ></div>
        <div
          class="cell bg-gradient-to-br from-purple-900 to-purple-700 rounded-xl shadow-lg w-24 h-24 flex items-center justify-center text-5xl font-bold cursor-pointer hover:scale-110"
        ></div>
        <div
          class="cell bg-gradient-to-br from-purple-900 to-purple-700 rounded-xl shadow-lg w-24 h-24 flex items-center justify-center text-5xl font-bold cursor-pointer hover:scale-110"
        ></div>
        <div
          class="cell bg-gradient-to-br from-purple-900 to-purple-700 rounded-xl shadow-lg w-24 h-24 flex items-center justify-center text-5xl font-bold cursor-pointer hover:scale-110"
        ></div>
        <div
          class="cell bg-gradient-to-br from-purple-900 to-purple-700 rounded-xl shadow-lg w-24 h-24 flex items-center justify-center text-5xl font-bold cursor-pointer hover:scale-110"
        ></div>
        <div
          class="cell bg-gradient-to-br from-purple-900 to-purple-700 rounded-xl shadow-lg w-24 h-24 flex items-center justify-center text-5xl font-bold cursor-pointer hover:scale-110"
        ></div>
        <div
          class="cell bg-gradient-to-br from-purple-900 to-purple-700 rounded-xl shadow-lg w-24 h-24 flex items-center justify-center text-5xl font-bold cursor-pointer hover:scale-110"
        ></div>
        <div
          class="cell bg-gradient-to-br from-purple-900 to-purple-700 rounded-xl shadow-lg w-24 h-24 flex items-center justify-center text-5xl font-bold cursor-pointer hover:scale-110"
        ></div>
      </div>
      <button
        id="reset"
        class="w-full bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-bold py-3 px-4 rounded-xl text-lg transition duration-300 shadow-lg hover:scale-105"
      >
        🔄 Reset Game
      </button>
    </div>

    <script>
      $(document).ready(function () {
        let currentPlayer = "X";
        let gameActive = true;

        $(".cell").click(function () {
          if ($(this).text() === "" && gameActive) {
            $(this).text(currentPlayer).addClass(currentPlayer);
            if (checkWin()) {
              $("#status").html(
                `🎉 Player <span class="text-${currentPlayer === "X" ? "cyan-400" : "pink-400"}">${currentPlayer}</span> wins!`
              );
              gameActive = false;
            } else if (checkDraw()) {
              $("#status").html(`🤝 It's a draw!`);
              gameActive = false;
            } else {
              currentPlayer = currentPlayer === "X" ? "O" : "X";
              $("#status").html(
                `Player <span class="text-${currentPlayer === "X" ? "cyan-400" : "pink-400"}">${currentPlayer}</span>'s turn`
              );
            }
          }
        });

        $("#reset").click(function () {
          $(".cell").text("").removeClass("X O");
          currentPlayer = "X";
          gameActive = true;
          $("#status").html(
            `Player <span class="text-cyan-400">X</span>'s turn`
          );
        });

        $("#toggleDark").click(function () {
          $("body").toggleClass("dark");
          if ($("body").hasClass("dark")) {
            $(this).html("☀️ Light Mode");
          } else {
            $(this).html("🌙 Dark Mode");
          }
        });

        function checkWin() {
          const winPatterns = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6],
          ];
          return winPatterns.some((pattern) => {
            const [a, b, c] = pattern;
            const cells = $(".cell");
            return (
              cells.eq(a).text() !== "" &&
              cells.eq(a).text() === cells.eq(b).text() &&
              cells.eq(a).text() === cells.eq(c).text()
            );
          });
        }

        function checkDraw() {
          return $(".cell:empty").length === 0;
        }
      });
    </script>
  </body>
</html>
